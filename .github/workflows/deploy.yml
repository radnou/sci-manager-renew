name: Deploy to Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["quality-gate"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 15

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/gerersci

            echo "=== Backup .env before deploy ==="
            cp .env.production .env.pre-deploy-$(date +%Y%m%d-%H%M%S) 2>/dev/null || true

            echo "=== Fix file ownership before pull ==="
            sudo chown -R $(whoami):$(whoami) .

            echo "=== Pulling latest code ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Restore .env symlink ==="
            ln -sf .env.production .env

            echo "=== Validating .env (no localhost in production) ==="
            if grep -q 'VITE_API_URL=http://localhost' .env; then
              echo "FATAL: .env contains localhost URLs! Aborting deploy."
              echo "Fix: update VITE_API_URL, CORS_ORIGINS, FRONTEND_URL in .env"
              exit 1
            fi
            if grep -q 'CORS_ORIGINS=.*localhost' .env; then
              echo "FATAL: CORS_ORIGINS contains localhost! Aborting deploy."
              exit 1
            fi
            echo ".env validation passed"

            echo "=== Building containers ==="
            docker compose build

            echo "=== Deploying with rolling restart ==="
            # Restart backend first (frontend depends on it)
            docker compose up -d --no-deps backend
            sleep 10

            # Check backend health via docker exec (port 8000 on host is Supabase Kong)
            for i in $(seq 1 30); do
              if docker compose exec -T backend curl -sf http://localhost:8000/health/live > /dev/null 2>&1; then
                echo "Backend healthy after ${i}s"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Backend health check failed after 30s"
                docker compose logs backend --tail=50
                exit 1
              fi
              sleep 1
            done

            # Now restart frontend
            docker compose up -d --no-deps frontend
            sleep 10

            # Reload reverse proxy ONLY if it is managed here. In production the
            # reverse proxy is host-level Caddy (see deploy.sh) which does NOT need
            # a reload on app-code deploys — the container ports are unchanged. This
            # step is therefore best-effort and must never fail the deployment.
            if docker ps --format '{{.Names}}' | grep -q gerersci_caddy; then
              echo "Reloading Caddy (compose)..."
              docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d --no-deps caddy || echo "WARN: caddy (compose) reload skipped"
            elif docker compose ps --services 2>/dev/null | grep -qx nginx; then
              echo "Reloading nginx (compose)..."
              docker compose up -d --no-deps nginx || echo "WARN: nginx (compose) reload skipped"
            elif systemctl is-active --quiet caddy 2>/dev/null; then
              echo "Reloading host Caddy..."
              sudo systemctl reload caddy || echo "WARN: host Caddy reload skipped"
            else
              echo "No compose-managed reverse proxy found; host proxy left untouched (OK)."
            fi

            echo "=== Final health checks ==="
            sleep 5

            # Backend readiness (via nginx HTTPS)
            READY=$(curl -sf https://api.gerersci.fr/health/ready 2>/dev/null || echo '{"status":"FAIL"}')
            echo "Backend readiness: $READY"

            if echo "$READY" | grep -q '"status":"not_ready"'; then
              echo "FATAL: Backend readiness is not_ready"
              exit 1
            fi

            # Frontend check (via nginx HTTPS)
            if curl -sf https://app.gerersci.fr/ > /dev/null 2>&1; then
              echo "Frontend: OK"
            else
              echo "Frontend: FAILED"
              docker compose logs frontend --tail=30
              exit 1
            fi

            echo "=== Deployment successful! ==="
            docker compose ps

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd /opt/gerersci

            echo "=== ROLLBACK: reverting to previous commit ==="
            # Revert to the commit before the failed deploy
            # The deploy hasn't changed HEAD yet (it uses fetch + reset),
            # so the previous HEAD is still the working state if health check failed.
            # Safety: check if current commit matches the deployed one
            CURRENT=$(git rev-parse HEAD)
            PREVIOUS=$(git rev-parse HEAD~1)
            echo "Current HEAD: $CURRENT"
            echo "Rolling back to: $PREVIOUS"

            # Restore .env from pre-deploy backup
            LATEST_BACKUP=$(ls -t .env.pre-deploy-* 2>/dev/null | head -1)
            if [ -n "$LATEST_BACKUP" ]; then
              cp "$LATEST_BACKUP" .env
              echo "Restored .env from $LATEST_BACKUP"
            fi

            # Rebuild and deploy previous version
            git reset --hard "$PREVIOUS"
            docker compose build --no-cache
            docker compose up -d --remove-orphans

            echo "=== Rollback complete ==="
            docker compose ps

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment failed and rollback executed!"
          echo "::error::Check VPS: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          echo "::error::Debug: docker compose logs --tail=100"

  smoke_public:
    name: Smoke Prod Public
    runs-on: ubuntu-latest
    needs: [deploy]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run prod smoke public
        env:
          E2E_BASE_URL: https://app.gerersci.fr
          E2E_API_BASE_URL: https://api.gerersci.fr
        run: pnpm --dir frontend run test:e2e:prod:public

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-prod-public-report
          path: frontend/playwright-report/
          retention-days: 7

  smoke_auth:
    name: Smoke Prod Auth
    runs-on: ubuntu-latest
    needs: [deploy]
    if: ${{ always() && needs.deploy.result == 'success' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run prod smoke auth
        env:
          E2E_BASE_URL: https://gerersci.fr
          E2E_API_BASE_URL: https://api.gerersci.fr
          E2E_MAGIC_LINK_URL: ${{ secrets.E2E_MAGIC_LINK_URL }}
          E2E_AUTH_TOKEN: ${{ secrets.E2E_AUTH_TOKEN }}
          E2E_USER_ID: ${{ secrets.E2E_USER_ID }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_SCI_ID: ${{ secrets.E2E_SCI_ID }}
          E2E_BIEN_ID: ${{ secrets.E2E_BIEN_ID }}
        run: pnpm --dir frontend run test:e2e:prod:auth

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-prod-auth-report
          path: frontend/playwright-report/
          retention-days: 7

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GérerSCI — Mise à jour en cours</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 480px;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 2rem;
    }
    .logo span { font-size: 1.5rem; font-weight: 700; color: #38bdf8; }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 1rem; }
    p { color: #94a3b8; line-height: 1.6; margin-bottom: 1.5rem; }
    .badge {
      display: inline-block;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    .contact {
      font-size: 0.875rem;
      color: #64748b;
    }
    .contact a { color: #38bdf8; text-decoration: none; }
    .contact a:hover { text-decoration: underline; }
    .progress {
      width: 200px;
      height: 4px;
      background: #334155;
      border-radius: 2px;
      margin: 0 auto 2rem;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      border-radius: 2px;
      animation: loading 2s ease-in-out infinite;
    }
    @keyframes loading {
      0% { width: 0; }
      50% { width: 70%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="36" height="36">
        <rect x="12" y="20" width="40" height="36" rx="2" fill="#0284c7"/>
        <path d="M8 22L32 6L56 22" stroke="#0284c7" stroke-width="4" stroke-linecap="round" fill="none"/>
        <rect x="19" y="28" width="8" height="6" rx="1" fill="#fff"/>
        <rect x="37" y="28" width="8" height="6" rx="1" fill="#fff"/>
        <rect x="19" y="40" width="8" height="6" rx="1" fill="#fff"/>
        <rect x="37" y="40" width="8" height="6" rx="1" fill="#fff"/>
        <rect x="27" y="44" width="10" height="12" rx="1.5" fill="#fff"/>
        <circle cx="50" cy="14" r="10" fill="#10b981"/>
        <path d="M44.5 14L48 17.5L55.5 10" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>GérerSCI</span>
    </div>
    <div class="badge">Mise à jour v1.0</div>
    <h1>Nous préparons quelque chose de beau.</h1>
    <div class="progress"><div class="progress-bar"></div></div>
    <p>
      GérerSCI est en cours de mise à jour vers la version 1.0.
      Le service sera de retour très bientôt.
    </p>
    <p class="contact">
      Une question ? <a href="mailto:contact@gerersci.fr">contact@gerersci.fr</a>
    </p>
  </div>
</body>
</html>
